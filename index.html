<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSV Wieblingen – Spielpaarungen Mobile</title>
<style>
:root{
  --club-blue:#2f327e;
  --club-blue-2:#40458f;
  --club-blue-3:#eef1ff;
  --club-blue-4:#dfe4ff;
  --club-ink:#1f2255;
  --white:#ffffff;
  --bg:#f5f7ff;
  --line:#c8d0ff;
  --muted:#61679a;
  --success:#1f7a4e;
  --shadow:0 12px 32px rgba(47,50,126,.14);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--club-ink);
  background:radial-gradient(circle at top, #ffffff 0%, #eef2ff 45%, #e8ecff 100%);
}
header{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:16px 22px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.header-left{display:flex;align-items:center;gap:16px;min-width:0}
.logo{
  width:78px;height:78px;object-fit:contain;border-radius:50%;background:#fff;
  border:2px solid var(--line);box-shadow:var(--shadow);flex:0 0 auto;
}
.title-wrap{min-width:0}
h1{margin:0;font-size:32px;line-height:1.05;color:var(--club-blue)}
.subtitle{margin-top:6px;color:var(--muted);font-size:15px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
button{
  border:none;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;
  background:var(--club-blue);color:#fff;box-shadow:var(--shadow)
}
button.secondary{background:#fff;color:var(--club-blue);border:2px solid var(--club-blue)}
.setup{
  margin:18px 18px 0;background:rgba(255,255,255,.92);border:2px solid var(--line);
  border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)
}
.setup.hidden{display:none}
.setup h2{margin:0 0 14px 0;color:var(--club-blue)}
.setup-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input{
  width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);
  background:#fff;color:var(--club-ink);font-size:15px
}
.note{
  margin-top:14px;padding:12px 14px;background:var(--club-blue-3);border-radius:14px;
  border:1px solid var(--line);font-size:14px;color:var(--club-ink)
}
.main{
  display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:18px;padding:18px;
}
.card{
  background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:24px;
  padding:18px;box-shadow:var(--shadow)
}
.card h2{margin:0 0 14px 0;font-size:26px;color:var(--club-blue)}
.section-title{
  display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px 0;
}
.section-title h3{margin:0;font-size:20px;color:var(--club-blue)}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--club-blue-3);color:var(--club-blue);font-weight:700;font-size:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 10px;border-bottom:1px solid #e5e9ff;text-align:left}
th{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td{font-size:17px}
.rank{width:44px;text-align:center;font-weight:700}
.points{font-weight:800;color:var(--club-blue)}
.matches{display:grid;gap:10px}
.match{
  border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:linear-gradient(180deg,#fff,#f8f9ff)
}
.match-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:700}
.teams-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.team-right{text-align:right}
.score{font-size:24px;font-weight:800;color:var(--club-blue);min-width:82px;text-align:center}
.winner{margin-top:8px;color:var(--success);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.qualified-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seed{
  background:var(--club-blue-3);border:1px solid var(--line);border-radius:16px;padding:10px 12px
}
.seed .seed-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.seed .seed-team{margin-top:5px;font-weight:800;color:var(--club-blue)}
.final-grid{display:grid;gap:10px}
.hero{
  margin:0 18px 0;padding:14px 18px;border:2px solid var(--line);border-radius:24px;
  background:linear-gradient(90deg,#ffffff,#eef1ff);display:flex;justify-content:space-between;gap:18px;align-items:center
}
.hero-text{font-size:15px;color:var(--muted)}
.hero strong{color:var(--club-blue)}
footer{padding:0 18px 18px}
.status{
  margin-top:18px;padding:14px 16px;background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:18px;
  color:var(--muted);font-size:14px;box-shadow:var(--shadow)
}
@media (max-width:1300px){
  .main{grid-template-columns:1fr}
  .setup-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  header{flex-direction:column;align-items:flex-start}
  .controls{justify-content:flex-start}
  .setup-grid{grid-template-columns:1fr}
  h1{font-size:26px}
  .logo{width:64px;height:64px}
}
</style>

<style>
/* Smartphone-optimierte Version ohne Kopfzeile und Setup-Oberfläche */
html{scroll-behavior:smooth;}
body{min-width:320px;background:#eef2ff;}
.hero{margin:10px 10px 0;padding:12px 14px;border-radius:18px;align-items:flex-start;}
.hero-text{font-size:14px;line-height:1.35;}
.main,.main.matches-page{display:grid;grid-template-columns:1fr!important;gap:12px;padding:10px;}
.card{border-radius:18px;padding:12px;border-width:1px;box-shadow:0 6px 18px rgba(47,50,126,.10);}
.card h2{font-size:20px;margin-bottom:10px;}
.section-title{margin:14px 0 8px 0;}
.section-title h3{font-size:16px;}
.matches{gap:8px;}
.match{border-radius:14px;padding:10px;border-width:1px;}
.match-head{font-size:12px;margin-bottom:7px;}
.teams-row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px;font-size:14px;}
.score{font-size:20px;min-width:58px;}
.team-right{text-align:right;}
.badge{font-size:11px;padding:4px 8px;white-space:nowrap;}
footer{padding:0 10px 10px;}
.status{margin-top:8px;padding:10px 12px;border-radius:14px;font-size:12px;border-width:1px;}
@media (max-width:420px){
  .hero{display:block;}
  .hero .badge{display:inline-block;margin-top:8px;}
  .card h2{font-size:18px;}
  .teams-row{font-size:13px;}
  .score{font-size:18px;min-width:52px;}
}
</style>

<style>
.main.groups{grid-template-columns:1fr 1fr;}
.main.matches-page{grid-template-columns:1fr 1fr 1fr;}
.main.finals-page{grid-template-columns:1fr;}
@media (max-width:1300px){.main.groups,.main.matches-page,.main.finals-page{grid-template-columns:1fr}}
</style>

</head><body>
<section class="hero">
  <div class="hero-text"><strong>Spielpaarungen der Gruppenphase</strong> Teams · Spiele · Tabellen · Finalrunde</div>
  <div class="badge">TSV Wieblingen Design</div>
</section>
<section class="main matches-page">
  <article class="card">
    <h2>Gesamtablauf</h2>
    <div class="section-title"><h3>Gruppenphase</h3><span class="badge">A / B im Wechsel</span></div>
    <div id="scheduleCombined" class="matches"></div>
  </article>
  <article class="card">
    <h2>Spielpaarungen Gruppe A</h2>
    <div id="matchesA" class="matches"></div>
  </article>
  <article class="card">
    <h2>Spielpaarungen Gruppe B</h2>
    <div id="matchesB" class="matches"></div>
  </article>
</section>
<footer>
  <div id="status" class="status">Lade Daten …</div>
</footer>
<script>
const STORAGE_KEY = 'tsv_wieblingen_elfmeterturnier_config';

/*
  Settings direkt hier eintragen.
  spreadsheetId akzeptiert entweder nur die ID oder die komplette Google-Sheets-URL.
  Optional kann die ID auch per URL gesetzt werden: ?id=DEINE_SPREADSHEET_ID
*/
const EMBEDDED_SETTINGS = {
  spreadsheetId: '',
  teamsSheet: 'Teams',
  matchesSheet: 'Spiele',
  finalSheet: 'Finalrunde'
};

function parseSpreadsheetId(value){
  const raw = String(value || '').trim();
  if(!raw) return '';
  const match = raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : raw;
}

function getConfig(){
  const params = new URLSearchParams(window.location.search);
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }catch(_){ saved = {}; }

  const cfg = {
    ...EMBEDDED_SETTINGS,
    ...saved,
    spreadsheetId: params.get('id') || params.get('spreadsheetId') || EMBEDDED_SETTINGS.spreadsheetId || saved.spreadsheetId || '',
    teamsSheet: params.get('teams') || EMBEDDED_SETTINGS.teamsSheet || saved.teamsSheet || 'Teams',
    matchesSheet: params.get('matches') || EMBEDDED_SETTINGS.matchesSheet || saved.matchesSheet || 'Spiele',
    finalSheet: params.get('final') || EMBEDDED_SETTINGS.finalSheet || saved.finalSheet || 'Finalrunde'
  };
  cfg.spreadsheetId = parseSpreadsheetId(cfg.spreadsheetId);
  return cfg;
}
function setConfigForm(cfg){ /* Keine Setup-Oberfläche in der Mobile-Version. */ }
function saveConfig(){ loadAll(); }
function fillDefaults(){ /* Keine Setup-Oberfläche in der Mobile-Version. */ }
function toggleSetup(){ /* Keine Setup-Oberfläche in der Mobile-Version. */ }
function setStatus(text){
  document.getElementById('status').textContent = text;
}
function buildUrl(spreadsheetId, sheetName){
  const id = parseSpreadsheetId(spreadsheetId);
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&headers=1&tqx=out:json`;
}
function cellValue(cell){
  if(!cell) return '';
  if(cell.f !== undefined && (cell.v === null || cell.v === undefined) && cell.f !== null) return String(cell.f);
  if(cell.f !== undefined && cell.v !== null && cell.v !== undefined){
    if(typeof cell.v === 'string') return cell.v;
  }
  if(cell.f !== undefined && cell.f !== null && cell.v === '') return String(cell.f);
  if(cell.f !== undefined && cell.f !== null && cell.v == null && cell.f) return String(cell.f);
  if(cell.f !== undefined && cell.f !== null && cell.v !== null && typeof cell.v !== 'number' && cell.f) return String(cell.f);
  if(cell.f !== undefined && cell.f !== null && cell.v !== null && typeof cell.v === 'number') return cell.v;
  if(cell.f !== undefined && cell.f !== null && cell.v !== null) return cell.v;
  return cell.v ?? '';
}
function cellDisplay(cell){
  if(!cell) return '';
  return cell.f ?? cell.v ?? '';
}
async function fetchSheet(spreadsheetId, sheetName){
  const url = buildUrl(spreadsheetId, sheetName);
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status} bei ${sheetName}`);
  const txt = await res.text();
  const start = txt.indexOf('{');
  const end = txt.lastIndexOf('}');
  if(start < 0 || end < 0) throw new Error(`Keine JSON-Daten bei ${sheetName}. Sheet öffentlich/freigegeben?`);
  const data = JSON.parse(txt.slice(start, end + 1));
  if(data.status === 'error'){
    const reason = data.errors?.map(e => e.detailed_message || e.message).join(' · ') || 'Google Sheets Fehler';
    throw new Error(`${sheetName}: ${reason}`);
  }
  return (data.table.rows || []).map(r => r.c || []);
}
function normalizeTeams(rows){
  const teams = {A:{}, B:{}};
  rows.forEach(r => {
    const group = String(cellDisplay(r[0]) || '').trim().toUpperCase();
    const slot = Number(cellValue(r[1]));
    const name = String(cellDisplay(r[2]) || '').trim();
    if((group === 'A' || group === 'B') && slot) teams[group][slot] = name || `${group}${slot}`;
  });
  return teams;
}
function normalizeMatches(rows){
  return rows.map(r => ({
    group: String(cellDisplay(r[0]) || '').trim().toUpperCase(),
    matchNo: Number(cellValue(r[1]) || 0),
    round: Number(cellValue(r[2]) || 0),
    homeSlot: Number(cellValue(r[3]) || 0),
    awaySlot: Number(cellValue(r[4]) || 0),
    homeGoals: r[5] && cellValue(r[5]) !== '' ? Number(cellValue(r[5])) : null,
    awayGoals: r[6] && cellValue(r[6]) !== '' ? Number(cellValue(r[6])) : null,
  })).filter(m => (m.group === 'A' || m.group === 'B') && m.matchNo && m.homeSlot && m.awaySlot);
}
function computeTable(teamMap, matches){
  const rows = Object.keys(teamMap)
    .sort((a,b) => Number(a) - Number(b))
    .map(slot => ({slot:Number(slot), team:teamMap[slot], sp:0,s:0,u:0,n:0,gf:0,ga:0,td:0,pkt:0}));
  const bySlot = Object.fromEntries(rows.map(r => [r.slot, r]));
  matches.forEach(m => {
    if(m.homeGoals == null || m.awayGoals == null || Number.isNaN(m.homeGoals) || Number.isNaN(m.awayGoals)) return;
    const h = bySlot[m.homeSlot], a = bySlot[m.awaySlot];
    if(!h || !a) return;
    h.sp++; a.sp++;
    h.gf += m.homeGoals; h.ga += m.awayGoals;
    a.gf += m.awayGoals; a.ga += m.homeGoals;
    if(m.homeGoals > m.awayGoals){ h.s++; a.n++; h.pkt += 3; }
    else if(m.awayGoals > m.homeGoals){ a.s++; h.n++; a.pkt += 3; }
    else { h.u++; a.u++; h.pkt += 1; a.pkt += 1; }
  });
  rows.forEach(r => r.td = r.gf - r.ga);
  rows.sort((x,y) => y.pkt - x.pkt || y.td - x.td || y.gf - x.gf || x.team.localeCompare(y.team,'de'));
  return rows;
}
function setHtml(id, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = html;
}
function renderTable(elId, rows){
  setHtml(elId, `
    <table>
      <thead><tr><th class="rank">#</th><th>Team</th><th>Sp</th><th>TD</th><th>Tore</th><th>Pkt</th></tr></thead>
      <tbody>
        ${rows.map((r,i) => `<tr><td class="rank">${i+1}</td><td>${escapeHtml(r.team)}</td><td>${r.sp}</td><td>${r.td}</td><td>${r.gf}</td><td class="points">${r.pkt}</td></tr>`).join('')}
      </tbody>
    </table>`);
}
function winnerName(home, hg, ag, away){
  if(hg == null || ag == null || Number.isNaN(hg) || Number.isNaN(ag)) return '';
  if(hg > ag) return home;
  if(ag > hg) return away;
  return 'Stechen nötig';
}
function scoreText(hg, ag){
  if(hg == null || ag == null || Number.isNaN(hg) || Number.isNaN(ag)) return '<span class="muted">- : -</span>';
  return `${hg} : ${ag}`;
}
function renderGroupMatches(elId, groupLabel, teamMap, matches){
  const html = matches
    .sort((a,b) => a.matchNo - b.matchNo)
    .map(m => {
      const home = teamMap[m.homeSlot] || `Platz ${m.homeSlot}`;
      const away = teamMap[m.awaySlot] || `Platz ${m.awaySlot}`;
      const winner = winnerName(home, m.homeGoals, m.awayGoals, away);
      return `
        <div class="match">
          <div class="match-head"><span>Gruppe ${groupLabel} · Spiel ${m.matchNo}</span><span>Runde ${m.round}</span></div>
          <div class="teams-row"><div>${escapeHtml(home)}</div><div class="score">${scoreText(m.homeGoals,m.awayGoals)}</div><div class="team-right">${escapeHtml(away)}</div></div>
          <div class="winner">${winner ? 'Führend / Sieger: ' + escapeHtml(winner) : ''}</div>
        </div>`;
    }).join('');
  setHtml(elId, html || '<div class="muted">Keine Spiele gefunden.</div>');
}
function interleaveMatches(matchesA, matchesB, teamsA, teamsB){
  const a = [...matchesA].sort((x,y)=>x.matchNo-y.matchNo);
  const b = [...matchesB].sort((x,y)=>x.matchNo-y.matchNo);
  const out = [];
  const len = Math.max(a.length, b.length);
  for(let i=0;i<len;i++){
    if(a[i]) out.push({group:'A', data:a[i], teams:teamsA});
    if(b[i]) out.push({group:'B', data:b[i], teams:teamsB});
  }
  return out;
}
function renderCombinedSchedule(matchesA, matchesB, teamsA, teamsB){
  const combined = interleaveMatches(matchesA, matchesB, teamsA, teamsB);
  const html = combined.map((entry, idx) => {
    const m = entry.data;
    const home = entry.teams[m.homeSlot] || `Platz ${m.homeSlot}`;
    const away = entry.teams[m.awaySlot] || `Platz ${m.awaySlot}`;
    return `
      <div class="match">
        <div class="match-head"><span>Lauf ${idx+1}</span><span>Gruppe ${entry.group} · Runde ${m.round}</span></div>
        <div class="teams-row"><div>${escapeHtml(home)}</div><div class="score">${scoreText(m.homeGoals,m.awayGoals)}</div><div class="team-right">${escapeHtml(away)}</div></div>
      </div>`;
  }).join('');
  setHtml('scheduleCombined', html || '<div class="muted">Keine Gruppenspiele gefunden.</div>');
}
function normalizeFinals(rows){
  return rows.map((r, idx) => ({
    row: idx + 1,
    phase: String(cellDisplay(r[0]) || '').trim(),
    game: String(cellDisplay(r[1]) || '').trim(),
    home: String(cellDisplay(r[2]) || '').trim(),
    away: String(cellDisplay(r[3]) || '').trim(),
    homeGoals: r[4] && cellValue(r[4]) !== '' ? Number(cellValue(r[4])) : null,
    awayGoals: r[5] && cellValue(r[5]) !== '' ? Number(cellValue(r[5])) : null,
    winner: String(cellDisplay(r[6]) || '').trim(),
    loser: String(cellDisplay(r[7]) || '').trim(),
  })).filter(x => x.phase || x.game || x.home || x.away);
}
function renderQualified(tableA, tableB){
  const seeds = [
    ['A1', tableA[0]?.team || ''], ['A2', tableA[1]?.team || ''], ['A3', tableA[2]?.team || ''], ['A4', tableA[3]?.team || ''],
    ['B1', tableB[0]?.team || ''], ['B2', tableB[1]?.team || ''], ['B3', tableB[2]?.team || ''], ['B4', tableB[3]?.team || '']
  ];
  setHtml('qualified', seeds.map(([label,team]) => `
    <div class="seed"><div class="seed-label">${label}</div><div class="seed-team">${escapeHtml(team)}</div></div>
  `).join(''));
}
function renderFinalBlock(elId, list){
  const html = list.map(item => `
    <div class="match">
      <div class="match-head"><span>${escapeHtml(item.phase)}</span><span>${escapeHtml(item.game)}</span></div>
      <div class="teams-row"><div>${escapeHtml(item.home || '-')}</div><div class="score">${scoreText(item.homeGoals,item.awayGoals)}</div><div class="team-right">${escapeHtml(item.away || '-')}</div></div>
      <div class="winner">${item.winner ? 'Sieger: ' + escapeHtml(item.winner) : ''}</div>
    </div>
  `).join('');
  setHtml(elId, html || '<div class="muted">Keine Spiele gefunden.</div>');
}
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function startRefresh(){ /* Auto-Refresh entfernt. */ }
async function loadAll(){
  const cfg = getConfig();
  if(!cfg.spreadsheetId){
    setStatus('Keine Spreadsheet-ID gefunden. Trage sie in EMBEDDED_SETTINGS ein oder öffne die Datei mit ?id=DEINE_ID.');
    return;
  }
  try{
    setStatus('Lade Daten aus Google Sheets …');
    const [teamRows, matchRows, finalRows] = await Promise.all([
      fetchSheet(cfg.spreadsheetId, cfg.teamsSheet),
      fetchSheet(cfg.spreadsheetId, cfg.matchesSheet),
      fetchSheet(cfg.spreadsheetId, cfg.finalSheet)
    ]);
    const teams = normalizeTeams(teamRows);
    const matches = normalizeMatches(matchRows);
    const matchesA = matches.filter(m => m.group === 'A');
    const matchesB = matches.filter(m => m.group === 'B');
    const tableA = computeTable(teams.A, matchesA);
    const tableB = computeTable(teams.B, matchesB);
    const finals = normalizeFinals(finalRows);
    renderTable('tableA', tableA);
    renderTable('tableB', tableB);
    renderGroupMatches('matchesA', 'A', teams.A, matchesA);
    renderGroupMatches('matchesB', 'B', teams.B, matchesB);
    renderCombinedSchedule(matchesA, matchesB, teams.A, teams.B);
    renderQualified(tableA, tableB);
    renderFinalBlock('quarterfinals', finals.filter(x => x.phase.toLowerCase().includes('viertel')));
    renderFinalBlock('semifinals', finals.filter(x => x.phase.toLowerCase().includes('halb')));
    renderFinalBlock('finals', finals.filter(x => x.phase.toLowerCase().includes('platz 3') || x.phase.toLowerCase().includes('finale')));
    const now = new Date();
    setStatus(`Letzte Aktualisierung: ${now.toLocaleDateString('de-DE')} ${now.toLocaleTimeString('de-DE')} · TSV Heidelberg-Wieblingen Live-Anzeige verbunden.`);
  }catch(err){
    console.error(err);
    setStatus('Fehler beim Laden: ' + (err.message || err) + ' · Prüfe ID, Blattnamen und Freigabe (Jeder mit Link: Betrachter).');
  }
}
(function init(){
  const cfg = getConfig();
  setConfigForm(cfg);
  loadAll();
})();
window.refreshNow = loadAll;
</script>

</body>
